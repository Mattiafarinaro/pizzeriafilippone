name: Refresh published menu

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-menu
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate crawlable menu from Google Sheets
        run: python scripts/generate_menu_snapshot.py

      - name: Compile production CSS
        run: npm exec --yes --package=tailwindcss@3.4.17 -- tailwindcss --config tailwind.config.cjs --input src/input.css --output assets/site.css --minify

      - name: Commit refreshed menu and CSS
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html assets/site.css; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git add index.html assets/site.css
            git commit -m "Refresh published menu from Google Sheets"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Request GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            try {
              await github.rest.repos.requestPagesBuild({
                owner: context.repo.owner,
                repo: context.repo.repo
              });
              core.info("GitHub Pages build requested.");
            } catch (error) {
              core.warning(`Could not request a Pages build: ${error.message}`);
            }
